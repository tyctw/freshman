name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 3 * * *"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Query table
        run: |
          curl \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/scores?select=id&limit=1"
