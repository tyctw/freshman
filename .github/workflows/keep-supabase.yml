name: Keep Supabase Alive

on:
  schedule:
    # 每天台灣時間 11:00（UTC 03:00）
    - cron: "0 3 * * *"

    # 每天台灣時間 23:00（UTC 15:00）
    - cron: "0 15 * * *"

  # 可手動執行
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/scores?select=id&limit=1")

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Supabase ping failed!"
            exit 1
          fi

          echo "Supabase is awake ✅"
